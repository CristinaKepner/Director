<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Director Console · 导演台</title>
    <!-- backend location: default ../api/ (same origin as this page). Override with <meta name="director-api" content="https://host/api/">, window.DIRECTOR_API or ?api= -->
    <link rel="icon" href="./public/favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <!-- 图标：Lucide（ISC）原始 24×24 路径，内联成雪碧图 —— 不联网、能换色、放大不糊 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M22 12h-4"/><path d="M6 12H2"/><path d="M12 6V2"/><path d="M12 22v-4"/></symbol>
      <symbol id="i-columns" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l14-9Z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect width="12" height="12" x="6" y="6" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4H14"/><path d="M10 4H3"/><path d="M21 12H12"/><path d="M8 12H3"/><path d="M21 20H16"/><path d="M12 20H3"/><circle cx="12" cy="4" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="20" r="2"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></symbol>
      <symbol id="i-clapper" viewBox="0 0 24 24"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
      <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
    </svg>
    <div id="app" class="left-closed drawer-closed">
      <!-- top: only what you need to know where you are -->
      <header class="topbar">
        <span class="mark" title="Director Console">DC</span>
        <input id="projectName" class="ghost" title="工程名" />
        <select id="statePill" class="state edit" title="导演状态机"></select>
        <span class="spacer"></span>
        <button id="undoBtn" class="icon" data-tip="撤销" data-tip-sub="Cmd + Z"><svg class="gi"><use href="#i-undo"/></svg></button>
        <button id="redoBtn" class="icon" data-tip="重做" data-tip-sub="Shift + Cmd + Z"><svg class="gi"><use href="#i-redo"/></svg></button>
        <button id="guideBtn" class="icon" data-tip="怎么用" data-tip-sub="四步走一遍：草片 → 对一对 → 生成 → 成片"><svg class="gi"><use href="#i-help"/></svg></button>
        <button id="menuBtn" class="icon" data-tip="工程设置" data-tip-sub="画幅、保真度、示例、导入导出"><svg class="gi"><use href="#i-dots"/></svg></button>
        <div id="menu" class="menu" hidden>
          <label>保真度<select id="fidelity"><option value="blockout">白模语义</option><option value="stylized">形态可读</option></select></label>
          <label>着色<select id="shading"><option value="shaded">Shaded</option><option value="clay">Clay</option><option value="wire">Wire</option></select></label>
          <label>画幅<select id="aspect"></select></label>
          <label>模式<span class="seg" id="buildMode"><button data-build="set" class="on">布景</button><button data-build="blocking">调度</button></span></label>
          <label>示例<select id="demoSelect"><option value="">选择…</option></select></label>
          <div class="menu-row"><button id="fromRefBtn">从参照开始…</button></div>
          <div class="menu-row"><button id="exportBtn">导出工程</button><button id="importBtn">导入工程</button><input id="importFile" type="file" accept="application/json" hidden /></div>
          <div class="menu-row"><a href="../studio/" target="_blank" rel="noopener" style="flex:1"><button style="width:100%" title="可选的伴生应用（需本地构建）">Studio</button></a></div>
          <div class="menu-foot"><span id="saveHint"></span><span id="bridgePill" class="pill"></span></div>
        </div>
      </header>

      <!-- left: a rail; the panel opens only when you ask for it or select something -->
      <aside class="left">
        <div class="rail">
          <button data-left="scene" data-tip="场景" data-tip-sub="场里有什么：人、车、道具、机位、灯"><svg class="gi"><use href="#i-box"/></svg></button>
          <button data-left="props" data-tip="调参数" data-tip-sub="选中谁就调谁：位置、朝向、大小、焦段"><svg class="gi"><use href="#i-sliders"/></svg></button>
        </div>
        <div class="left-body">
          <section id="leftScene">
            <div class="panel-head"><h2>场景</h2><div class="row-actions"><button id="addEntity">+ 物体</button><button id="addCamera">+ 机位</button><button id="addLight">+ 灯</button></div></div>
            <div id="outliner" class="outliner"></div>
          </section>
          <section id="leftProps">
            <div class="panel-head"><h2 id="inspectorTitle">属性</h2><button id="deleteSel" class="danger" title="删除 (Del)">删除</button></div>
            <div id="inspector" class="inspector"></div>
          </section>
        </div>
      </aside>

      <!-- center: the picture, and the four controls you use every minute -->
      <main class="stage">
        <div id="viewport"></div>
        <div id="compare" class="stage-compare" hidden></div>
        <div class="hud">
          <div class="seg seg-ico"><button id="viewFree" class="on" data-tip="随便看" data-tip-sub="自己转着看整个场，不影响拍出来的画面 (P)"><svg class="gi"><use href="#i-eye"/></svg><b>随便看</b></button><button id="viewProgram" data-tip="拍到的" data-tip-sub="摄影机真正拍到的那一框，录草片录的就是它 (P)"><svg class="gi"><use href="#i-crosshair"/></svg><b>拍到的</b></button><button id="viewCompare" data-tip="对照" data-tip-sub="原片、草片、生成并排放，同一秒的同一构图"><svg class="gi"><use href="#i-columns"/></svg><b>对照</b></button></div>
          <div class="seg" id="gizmoSeg" hidden><button data-gizmo="translate" class="on" title="移动 (W)">移</button><button data-gizmo="rotate" title="旋转 (E)">转</button><button data-gizmo="scale" title="缩放 (R)">缩</button></div>
          <button id="playBtn" class="icon" data-tip="播放" data-tip-sub="空格"><svg class="gi"><use href="#i-play"/></svg></button>
          <span id="hudTc" class="tc">00:00:00:00</span>
          <button id="recordBtn" class="rec" data-tip="录草片" data-tip-sub="把这一镜在 3D 里录成一段视频。不花钱，录多少次都行"><svg class="gi"><use href="#i-rec"/></svg><b>录</b></button>
        </div>
        <div id="guide" class="guide" hidden></div>
      </main>

      <!-- right: one input, one thread -->
      <aside class="right">
        <div class="panel-head"><svg class="gi" style="color:var(--accent)"><use href="#i-sparkles"/></svg><h2>跟它说</h2><span id="agentStatus" class="dot" title=""></span><button id="agentSettingsBtn" class="icon" data-tip="怎么配合" data-tip-sub="用哪个模型规划；先问我再做，还是直接做"><svg class="gi"><use href="#i-sliders"/></svg></button></div>
        <div id="agentSettings" class="agent-settings" hidden>
          <label>后端<select id="agentBackend"><option value="rules">rules</option></select></label>
          <label>模式<select id="agentMode"><option value="collaborative">先确认</option><option value="lead">直接执行</option><option value="manual">只出方案</option></select></label>
        </div>
        <div id="agentThread" class="thread"></div>
        <div class="composer">
          <div class="chips" id="chips"></div>
          <div class="composer-row">
            <textarea id="agentInput" rows="2" placeholder="想改什么就说…"></textarea>
            <button id="agentSend" class="primary send" data-tip="发送" data-tip-sub="Enter"><svg class="gi"><use href="#i-send"/></svg></button>
          </div>
        </div>
      </aside>

      <!-- bottom: the shot strip is always there; the drawer opens when there is something to look at -->
      <footer class="bottom">
        <div class="strip">
          <div id="shotStrip" class="shots"></div>
          <button id="newShotBtn" class="icon" title="从当前 Program 机位新建镜头">+</button>
          <span class="spacer"></span>
          <!-- 四段流水线：先后关系摆在明面上。其余七个面板收进「更多」，一个都没少 -->
          <div class="pipe" id="pipe">
            <button data-bottom="check"><svg class="gi"><use href="#i-shield"/></svg><b>检查</b><i></i><em></em></button>
            <button data-bottom="takes"><svg class="gi"><use href="#i-camera"/></svg><b>草片</b><i></i><em></em></button>
            <button data-bottom="gen"><svg class="gi"><use href="#i-sparkles"/></svg><b>生成</b><i></i><em></em></button>
            <button data-bottom="film"><svg class="gi"><use href="#i-clapper"/></svg><b>成片</b><i></i><em></em></button>
          </div>
          <button id="moreBtn" class="icon" data-tip="更多" data-tip-sub="镜头、时间线、故事版、参照、资产、事件、状态"><svg class="gi"><use href="#i-list"/></svg></button>
          <div id="moreTabs" class="menu" hidden>
            <button data-bottom="shots">镜头清单</button>
            <button data-bottom="timeline">时间线</button>
            <button data-bottom="board">故事版</button>
            <button data-bottom="ref">参照</button>
            <button data-bottom="assets">资产</button>
            <button data-bottom="log">事件</button>
            <button data-bottom="health">状态</button>
          </div>
          <button id="drawerBtn" class="icon" title="展开 / 收起">▴</button>
        </div>
        <div id="bottomBody" class="bottom-body"></div>
      </footer>
    </div>
    <div id="tip" class="tipbox" hidden></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
