<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Director Console · 导演台</title>
    <!-- backend location: default ../api/ (same origin as this page). Override with <meta name="director-api" content="https://host/api/">, window.DIRECTOR_API or ?api= -->
    <link rel="icon" href="./public/favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" class="left-closed drawer-closed">
      <!-- top: only what you need to know where you are -->
      <header class="topbar">
        <span class="mark" title="Director Console">DC</span>
        <input id="projectName" class="ghost" title="工程名" />
        <select id="statePill" class="state edit" title="导演状态机"></select>
        <span class="spacer"></span>
        <button id="undoBtn" class="icon" title="撤销 (Ctrl+Z)">↶</button>
        <button id="redoBtn" class="icon" title="重做 (Ctrl+Shift+Z)">↷</button>
        <button id="guideBtn" class="icon" title="怎么用">?</button>
        <button id="menuBtn" class="icon" title="更多">⋯</button>
        <div id="menu" class="menu" hidden>
          <label>保真度<select id="fidelity"><option value="blockout">白模语义</option><option value="stylized">形态可读</option></select></label>
          <label>着色<select id="shading"><option value="shaded">Shaded</option><option value="clay">Clay</option><option value="wire">Wire</option></select></label>
          <label>画幅<select id="aspect"></select></label>
          <label>模式<span class="seg" id="buildMode"><button data-build="set" class="on">布景</button><button data-build="blocking">调度</button></span></label>
          <label>示例<select id="demoSelect"><option value="">选择…</option></select></label>
          <div class="menu-row"><button id="exportBtn">导出工程</button><button id="importBtn">导入工程</button><input id="importFile" type="file" accept="application/json" hidden /></div>
          <div class="menu-row"><a href="../studio/" target="_blank" rel="noopener" style="flex:1"><button style="width:100%" title="可选的伴生应用（需本地构建）">Studio</button></a></div>
          <div class="menu-foot"><span id="saveHint"></span><span id="bridgePill" class="pill"></span></div>
        </div>
      </header>

      <!-- left: a rail; the panel opens only when you ask for it or select something -->
      <aside class="left">
        <div class="rail">
          <button data-left="scene" title="场景对象">场景</button>
          <button data-left="props" title="选中对象的属性">属性</button>
        </div>
        <div class="left-body">
          <section id="leftScene">
            <div class="panel-head"><h2>场景</h2><div class="row-actions"><button id="addEntity">+ 物体</button><button id="addCamera">+ 机位</button><button id="addLight">+ 灯</button></div></div>
            <div id="outliner" class="outliner"></div>
          </section>
          <section id="leftProps">
            <div class="panel-head"><h2 id="inspectorTitle">属性</h2><button id="deleteSel" class="danger" title="删除 (Del)">删除</button></div>
            <div id="inspector" class="inspector"></div>
          </section>
        </div>
      </aside>

      <!-- center: the picture, and the four controls you use every minute -->
      <main class="stage">
        <div id="viewport"></div>
        <div class="hud">
          <div class="seg"><button id="viewFree" class="on" title="自由观察 (P)">自由</button><button id="viewProgram" title="拍摄机视角 (P)">Program</button></div>
          <div class="seg" id="gizmoSeg" hidden><button data-gizmo="translate" class="on" title="移动 (W)">移</button><button data-gizmo="rotate" title="旋转 (E)">转</button><button data-gizmo="scale" title="缩放 (R)">缩</button></div>
          <button id="playBtn" title="播放 / 暂停 (Space)">▶</button>
          <span id="hudTc" class="tc">00:00:00:00</span>
          <button id="recordBtn" class="rec" title="录制当前镜头的 Take">● 录制</button>
        </div>
        <div id="guide" class="guide" hidden></div>
      </main>

      <!-- right: one input, one thread -->
      <aside class="right">
        <div class="panel-head"><h2>Agent</h2><span id="agentStatus" class="dot" title=""></span><button id="agentSettingsBtn" class="icon" title="规划后端与协作模式">⚙</button></div>
        <div id="agentSettings" class="agent-settings" hidden>
          <label>后端<select id="agentBackend"><option value="rules">rules</option></select></label>
          <label>模式<select id="agentMode"><option value="collaborative">先确认</option><option value="lead">直接执行</option><option value="manual">只出方案</option></select></label>
        </div>
        <div id="agentThread" class="thread"></div>
        <div class="composer">
          <div class="chips" id="chips"></div>
          <div class="composer-row">
            <textarea id="agentInput" rows="2" placeholder="说一句你要的镜头、机位、动作或光…"></textarea>
            <button id="agentSend" class="primary">发送</button>
          </div>
        </div>
      </aside>

      <!-- bottom: the shot strip is always there; the drawer opens when there is something to look at -->
      <footer class="bottom">
        <div class="strip">
          <div id="shotStrip" class="shots"></div>
          <button id="newShotBtn" class="icon" title="从当前 Program 机位新建镜头">+</button>
          <span class="spacer"></span>
          <div class="bottom-tabs" id="bottomTabs">
            <button data-bottom="shots">镜头</button>
            <button data-bottom="timeline">时间线</button>
            <button data-bottom="takes">Take</button>
            <button data-bottom="board">故事版</button>
            <button data-bottom="gen">生成</button>
            <button data-bottom="log">事件</button>
            <button data-bottom="health">状态</button>
          </div>
          <button id="drawerBtn" class="icon" title="展开 / 收起">▴</button>
        </div>
        <div id="bottomBody" class="bottom-body"></div>
      </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
